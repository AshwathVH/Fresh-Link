<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Farmer Dashboard</title>
<style>
:root {
  --primary: #28a745;
  --secondary: #007bff;
  --danger: #dc3545;
  --bg: #f2f5f7;
  --font: "Segoe UI", Arial, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background-image: linear-gradient(rgba(40, 167, 69, 0.15), rgba(0, 123, 255, 0.15)), url('https://images.unsplash.com/photo-1592982537447-7440770cbfc9?w=1920&q=80');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  background-repeat: no-repeat;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  min-height: 100vh;
  gap: 2rem;
}
body::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 0;
  pointer-events: none;
}
.container {
  background: rgba(255, 255, 255, 0.25);
  backdrop-filter: blur(30px) saturate(180%);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  padding: 3rem;
  border-radius: 1.5rem;
  box-shadow: 
    0 8px 32px rgba(0,0,0,.3),
    inset 0 1px 0 rgba(255,255,255,0.6),
    inset 0 -1px 0 rgba(255,255,255,0.2);
  border: 2px solid rgba(255, 255, 255, 0.5);
  width: 900px;
  max-width: 95vw;
  animation: fadeInUp 0.6s ease;
  position: relative;
  overflow: hidden;
  z-index: 1;
}
.container::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: linear-gradient(
    45deg,
    transparent,
    rgba(255, 255, 255, 0.3),
    transparent
  );
  transform: rotate(45deg);
  pointer-events: none;
}
@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
h1 {
  color: var(--primary);
  text-align: center;
  margin-bottom: 1.5rem;
  text-shadow: 0 2px 10px rgba(255, 255, 255, 0.8);
  font-weight: 700;
}
label {
  display: block;
  font-weight: 500;
  margin-top: 1rem;
  color: #333;
}
input, textarea {
  width: 100%;
  padding: .6rem;
  margin-top: .3rem;
  background: rgba(255, 255, 255, 0.4);
  backdrop-filter: blur(15px) saturate(150%);
  -webkit-backdrop-filter: blur(15px) saturate(150%);
  border: 1.5px solid rgba(255, 255, 255, 0.6);
  border-radius: .5rem;
  font-size: .95rem;
  color: #000;
  transition: all 0.3s ease;
  box-shadow: 
    0 4px 15px rgba(0, 0, 0, 0.1),
    inset 0 1px 0 rgba(255, 255, 255, 0.5);
}
input:-webkit-autofill,
input:-webkit-autofill:hover,
input:-webkit-autofill:focus,
input:-webkit-autofill:active {
  -webkit-box-shadow: 0 0 0 30px rgba(255, 255, 255, 0.6) inset !important;
  -webkit-text-fill-color: #000 !important;
  color: #000 !important;
}
input:focus, textarea:focus {
  outline: none;
  background: rgba(255, 255, 255, 0.6);
  border: 1.5px solid rgba(40, 167, 69, 0.8);
  box-shadow: 
    0 0 20px rgba(40, 167, 69, 0.4),
    0 4px 20px rgba(0, 0, 0, 0.15),
    inset 0 1px 0 rgba(255, 255, 255, 0.7);
  transform: translateY(-2px);
}
textarea { height: 70px; resize: none; }
button {
  width: 100%;
  margin-top: 1.5rem;
  padding: .8rem;
  border: none;
  border-radius: .5rem;
  font-size: 1rem;
  cursor: pointer;
  transition: all 0.3s ease;
  backdrop-filter: blur(15px) saturate(150%);
  -webkit-backdrop-filter: blur(15px) saturate(150%);
  position: relative;
  overflow: hidden;
}
button::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
  transition: left 0.5s;
}
button:hover::before {
  left: 100%;
}
#saveBtn {
  background: rgba(40, 167, 69, 0.8);
  color: #fff;
  border: 2px solid rgba(255, 255, 255, 0.4);
  box-shadow: 
    0 4px 15px rgba(40, 167, 69, 0.4),
    inset 0 1px 0 rgba(255, 255, 255, 0.3);
  font-weight: 600;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
}
#saveBtn:hover { 
  background: rgba(33, 136, 56, 0.9);
  transform: translateY(-3px);
  box-shadow: 
    0 8px 25px rgba(40, 167, 69, 0.5),
    inset 0 1px 0 rgba(255, 255, 255, 0.4);
}
.link-buttons {
  display: flex;
  flex-direction: column;
  gap: .8rem;
  margin-top: 2rem;
}
.link-buttons button {
  background: rgba(0, 123, 255, 0.8);
  color: #fff;
  border: 2px solid rgba(255, 255, 255, 0.4);
  box-shadow: 
    0 4px 15px rgba(0, 123, 255, 0.4),
    inset 0 1px 0 rgba(255, 255, 255, 0.3);
  font-weight: 600;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
}
.link-buttons button:hover {
  background: rgba(0, 86, 179, 0.9);
  transform: translateY(-3px);
  box-shadow: 
    0 8px 25px rgba(0, 123, 255, 0.5),
    inset 0 1px 0 rgba(255, 255, 255, 0.4);
}
.success {
  text-align: center;
  color: var(--primary);
  font-weight: 600;
  margin-top: .8rem;
}
.display-card {
  background: rgba(255, 255, 255, 0.25);
  backdrop-filter: blur(30px) saturate(180%);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  padding: 3rem;
  border-radius: 1.5rem;
  box-shadow: 
    0 8px 32px rgba(0,0,0,.3),
    inset 0 1px 0 rgba(255,255,255,0.6),
    inset 0 -1px 0 rgba(255,255,255,0.2);
  border: 2px solid rgba(255, 255, 255, 0.5);
  width: 900px;
  max-width: 95vw;
  animation: fadeInUp 0.6s ease 0.2s both;
  position: relative;
  overflow: hidden;
  z-index: 1;
}
.display-card::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: linear-gradient(
    45deg,
    transparent,
    rgba(255, 255, 255, 0.3),
    transparent
  );
  transform: rotate(45deg);
  pointer-events: none;
}
.display-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1.5rem;
  position: relative;
}
.display-header h2 {
  color: var(--primary);
  font-size: 2rem;
  text-shadow: 0 2px 10px rgba(255, 255, 255, 0.8);
  font-weight: 700;
  margin: 0;
}
.profile-section {
  display: grid;
  grid-template-columns: 200px 1fr;
  gap: 2rem;
  margin-bottom: 2rem;
  position: relative;
}
.profile-photo-container {
  position: relative;
}
.profile-photo {
  width: 200px;
  height: 200px;
  border-radius: 1rem;
  background: rgba(255, 255, 255, 0.4);
  backdrop-filter: blur(15px) saturate(150%);
  -webkit-backdrop-filter: blur(15px) saturate(150%);
  border: 2px solid rgba(255, 255, 255, 0.6);
  box-shadow: 
    0 4px 15px rgba(0, 0, 0, 0.1),
    inset 0 1px 0 rgba(255, 255, 255, 0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 5rem;
  overflow: hidden;
  position: relative;
}
.profile-photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.profile-photo.placeholder {
  font-size: 4rem;
  color: rgba(0, 0, 0, 0.3);
}
.change-photo-btn {
  position: absolute;
  bottom: 10px;
  right: 10px;
  background: rgba(0, 123, 255, 0.9);
  border: 2px solid rgba(255, 255, 255, 0.4);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  color: #fff;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 4px 10px rgba(0, 123, 255, 0.4);
  font-size: 1.2rem;
}
.change-photo-btn:hover {
  transform: scale(1.15) rotate(15deg);
  box-shadow: 0 6px 15px rgba(0, 123, 255, 0.6);
}
.profile-info-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1rem;
}
.edit-icon {
  background: rgba(0, 123, 255, 0.8);
  border: 2px solid rgba(255, 255, 255, 0.4);
  backdrop-filter: blur(15px) saturate(150%);
  -webkit-backdrop-filter: blur(15px) saturate(150%);
  color: #fff;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 
    0 4px 15px rgba(0, 123, 255, 0.4),
    inset 0 1px 0 rgba(255, 255, 255, 0.3);
  font-size: 1.2rem;
  text-decoration: none;
}
.edit-icon:hover {
  transform: rotate(15deg) scale(1.1);
  box-shadow: 
    0 6px 20px rgba(0, 123, 255, 0.5),
    inset 0 1px 0 rgba(255, 255, 255, 0.4);
}
.info-row {
  margin-bottom: 0;
  position: relative;
}
.info-label {
  font-size: 0.85rem;
  font-weight: 600;
  color: rgba(51, 51, 51, 0.8);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 0.4rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.info-value {
  background: rgba(255, 255, 255, 0.4);
  backdrop-filter: blur(15px) saturate(150%);
  -webkit-backdrop-filter: blur(15px) saturate(150%);
  padding: 0.8rem 1rem;
  border-radius: 0.5rem;
  border: 1.5px solid rgba(255, 255, 255, 0.6);
  box-shadow: 
    0 4px 15px rgba(0, 0, 0, 0.1),
    inset 0 1px 0 rgba(255, 255, 255, 0.5);
  font-size: 0.95rem;
  color: #333;
  min-height: 45px;
  display: flex;
  align-items: center;
  font-weight: 500;
}
.info-value.about-text {
  min-height: 80px;
  align-items: flex-start;
  grid-column: 1 / -1;
}
.info-value.empty {
  color: #999;
  font-style: italic;
}
.nav-buttons-display {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 1rem;
  margin-top: 2rem;
  position: relative;
}
.nav-buttons-display button {
  margin-top: 0;
  padding: 0.7rem;
  font-size: 0.95rem;
}
.hidden {
  display: none;
}
.form-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1.5rem;
  position: relative;
}
.form-grid .full-width {
  grid-column: 1 / -1;
}
.photo-upload-section {
  grid-column: 1 / -1;
  text-align: center;
}
.photo-upload-area {
  width: 200px;
  height: 200px;
  margin: 1rem auto;
  border-radius: 1rem;
  background: rgba(255, 255, 255, 0.4);
  backdrop-filter: blur(15px) saturate(150%);
  -webkit-backdrop-filter: blur(15px) saturate(150%);
  border: 2px dashed rgba(255, 255, 255, 0.6);
  box-shadow: 
    0 4px 15px rgba(0, 0, 0, 0.1),
    inset 0 1px 0 rgba(255, 255, 255, 0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.3s ease;
  overflow: hidden;
  position: relative;
}
.photo-upload-area:hover {
  transform: scale(1.02);
  border-color: var(--primary);
  background: rgba(40, 167, 69, 0.1);
}
.photo-upload-area img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.photo-upload-area.placeholder {
  font-size: 4rem;
  color: rgba(0, 0, 0, 0.3);
}

</style>
</head>
<body>

<!-- Language Selector -->
<select id="languageSelector" style="position:fixed;top:1rem;right:1rem;z-index:1000;padding:0.6rem 1rem;background:rgba(255,255,255,0.25);backdrop-filter:blur(20px);border:2px solid rgba(255,255,255,0.4);border-radius:12px;font-size:1rem;font-weight:600;color:#333;cursor:pointer;transition:all 0.3s ease;box-shadow:0 4px 15px rgba(0,0,0,0.2)" onchange="i18n.setLanguage(this.value)">
  <option value="en">🇬🇧 English</option>
  <option value="hi">🇮🇳 हिंदी</option>
  <option value="kn">🇮🇳 ಕನ್ನಡ</option>
  <option value="ml">🇮🇳 മലയാളം</option>
</select>

<div style="position:fixed;top:20px;left:20px;z-index:1000">
  <button onclick="window.history.back()" style="padding:0.7rem 1.2rem;background:rgba(255,255,255,0.4);backdrop-filter:blur(15px);color:#333;border:1.5px solid rgba(255,255,255,0.6);font-weight:600;cursor:pointer;border-radius:0.5rem;transition:all 0.3s ease;box-shadow:0 4px 15px rgba(0,0,0,0.2)" onmouseover="this.style.background='rgba(255,255,255,0.6)';this.style.transform='translateY(-2px)'" onmouseout="this.style.background='rgba(255,255,255,0.4)';this.style.transform='translateY(0)'">← Back</button>
</div>

<!-- Display Card -->
<div class="display-card" id="displayCard">
  <div class="display-header">
    <h2>👨‍🌾 My Profile</h2>
    <a href="#" class="edit-icon" id="editBtn" title="Edit Profile">✏️</a>
  </div>
  
  <div class="profile-section">
    <div class="profile-photo-container">
      <div class="profile-photo" id="displayPhoto">
        👤
      </div>
      <div class="change-photo-btn" id="changePhotoBtn" title="Change Photo">📷</div>
    </div>
    
    <div class="profile-info-grid">
      <div class="info-row">
        <div class="info-label">📛 Full Name</div>
        <div class="info-value" id="displayName">-</div>
      </div>
      
      <div class="info-row">
        <div class="info-label">📞 Phone Number</div>
        <div class="info-value" id="displayPhone">-</div>
      </div>
      
      <div class="info-row">
        <div class="info-label">📍 Location</div>
        <div class="info-value" id="displayLocation">-</div>
      </div>
      
      <div class="info-row">
        <div class="info-label">⏱️ Experience</div>
        <div class="info-value" id="displayExperience">-</div>
      </div>
      
      <div class="info-row" style="grid-column: 1 / -1;">
        <div class="info-label">📝 About</div>
        <div class="info-value about-text" id="displayAbout">-</div>
      </div>
    </div>
  </div>

  <div class="nav-buttons-display">
    <button id="addCropBtnDisplay" style="background: rgba(40, 167, 69, 0.8); border: 2px solid rgba(255, 255, 255, 0.4); box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.3);">➥ Add Crop</button>
    <button id="viewListedBtnDisplay" style="background: rgba(0, 123, 255, 0.8); border: 2px solid rgba(255, 255, 255, 0.4); box-shadow: 0 4px 15px rgba(0, 123, 255, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.3);">📋 My Listings</button>
    <button id="viewInboxBtnDisplay" style="background: rgba(255, 193, 7, 0.8); border: 2px solid rgba(255, 255, 255, 0.4); box-shadow: 0 4px 15px rgba(255, 193, 7, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.3);">📨 Inbox</button>
  </div>
</div>

<!-- Edit/Form Card -->
<div class="container hidden" id="formCard">
  <div style="text-align: center; margin-bottom: 1rem;">
    <img src="GTN_logo.png" alt="GTN Logo" style="width: 80px; height: 80px; object-fit: contain;">
  </div>
  <h1>Edit Seller Details</h1>
  <form id="farmerForm">
    <div class="photo-upload-section">
      <label style="font-weight: 600; font-size: 1rem; margin-bottom: 0.5rem; display: block;">Profile Photo</label>
      <div class="photo-upload-area placeholder" id="photoUploadArea">👤</div>
      <input type="file" id="photoInput" accept="image/*" style="display:none" />
      <p style="font-size: 0.85rem; color: #666; margin-top: 0.5rem;">Click to upload photo (JPEG/PNG, max 5MB)</p>
    </div>
    
    <div class="form-grid">
      <div>
        <label for="farmerName">Full Name *</label>
        <input type="text" id="farmerName" required placeholder="Enter your name">
      </div>

      <div>
        <label for="farmerPhone">Phone Number *</label>
        <input type="text" id="farmerPhone" required maxlength="10" placeholder="10-digit phone number">
      </div>

        <label for="farmerLocation">Location *</label>
        <input type="text" id="farmerLocation" required placeholder="Village / City">
      </div>

        <input type="number" id="farmerExperience" min="0" placeholder="e.g. 5">

  <div class="link-buttons">

<!-- Inbox Card -->
<div class="container hidden" id="inboxCard">
  <div class="display-header">
    <h2>📨 Inbox - Orders Received</h2>
    <button id="closeInboxBtn" style="background: rgba(220, 53, 69, 0.8); border: 2px solid rgba(255, 255, 255, 0.4); backdrop-filter: blur(15px) saturate(150%); color: #fff; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(220, 53, 69, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.3); font-size: 1.2rem; text-decoration: none; border: none;">✕</button>
  </div>
  
  <div id="ordersContainer" style="margin-top: 1.5rem; max-height: 500px; overflow-y: auto;">
    <!-- Orders will be loaded here -->
  </div>
  
  <div id="noOrders" class="hidden" style="text-align: center; padding: 3rem; color: #666; font-size: 1.1rem;">
    📭 No orders received yet
  </div>
</div>

<script>
const API_URL = 'http://localhost:3000/api';
const token = localStorage.getItem('token');
const user = JSON.parse(localStorage.getItem('user') || '{}');

// Profile photo handling
let currentPhoto = null;
const photoInput = document.getElementById('photoInput');
const photoUploadArea = document.getElementById('photoUploadArea');
const displayPhoto = document.getElementById('displayPhoto');

// Get user-specific localStorage key
function getFarmerDetailsKey() {
  const user = JSON.parse(localStorage.getItem('user') || '{}');
  return user.id ? `farmerDetails_${user.id}` : 'farmerDetails';
}

// Load photo from database or localStorage
function loadPhoto() {
  const userData = JSON.parse(localStorage.getItem('user') || '{}');
  const photoUrl = userData.profilePhoto || currentPhoto;
  
  if (photoUrl) {
    currentPhoto = photoUrl;
    displayPhoto.innerHTML = `<img src="${photoUrl}" alt="Profile">`;
    displayPhoto.classList.remove('placeholder');
    photoUploadArea.innerHTML = `<img src="${photoUrl}" alt="Profile">`;
    photoUploadArea.classList.remove('placeholder');
  }
}

// Handle photo upload
photoUploadArea.addEventListener('click', () => photoInput.click());
document.getElementById('changePhotoBtn').addEventListener('click', (e) => {
  e.preventDefault();
  photoInput.click();
});

photoInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  
  const allowed = ['image/jpeg', 'image/png'];
  if (!allowed.includes(file.type)) {
    alert('Only JPEG or PNG allowed.');
    return;
  }
  if (file.size > 5 * 1024 * 1024) {
    alert('Image must be < 5 MB');
    return;
  }
  
  const reader = new FileReader();
  reader.onload = (e) => {
    currentPhoto = e.target.result;
    photoUploadArea.innerHTML = `<img src="${currentPhoto}" alt="Profile">`;
    photoUploadArea.classList.remove('placeholder');
  };
  reader.readAsDataURL(file);
});

// Fetch and update display card with user data from database
async function updateDisplayCard() {
  try {
    if (!token) {
      console.error('No token found in localStorage');
      alert('Please login again - no authentication token found');
      window.location.href = 'auth.html';
      return;
    }

    console.log('Fetching profile with token:', token.substring(0, 20) + '...');

    // Fetch user profile from database
    const response = await fetch(`${API_URL}/auth/profile`, {
      headers: {
        'Authorization': `Bearer ${token}`
      }
    });

    console.log('Response status:', response.status);

    if (!response.ok) {
      const errorData = await response.json().catch(() => ({ error: 'Unknown error' }));
      console.error('Profile fetch failed:', errorData);
      throw new Error(`Failed to fetch profile: ${errorData.error || response.statusText}`);
    }

    const userData = await response.json();
    console.log('✅ Loaded user data:', userData);
    
    // Update localStorage with fresh data
    localStorage.setItem('user', JSON.stringify(userData));
    
    // Display data from database
    document.getElementById('displayName').textContent = userData.name || '-';
    document.getElementById('displayPhone').textContent = userData.phone || '-';
    document.getElementById('displayLocation').textContent = userData.address || '-';
    document.getElementById('displayExperience').textContent = userData.experience ? `${userData.experience} years` : '-';
    document.getElementById('displayAbout').textContent = userData.about || '-';
    
    // Load profile photo
    if (userData.profilePhoto) {
      currentPhoto = userData.profilePhoto;
      displayPhoto.innerHTML = `<img src="${userData.profilePhoto}" alt="Profile">`;
      displayPhoto.classList.remove('placeholder');
    }
    
    // Add empty class if no data
    ['displayName', 'displayPhone', 'displayLocation', 'displayExperience', 'displayAbout'].forEach(id => {
      const el = document.getElementById(id);
      if (el.textContent === '-') {
        el.classList.add('empty');
      } else {
        el.classList.remove('empty');
      }
    });
  } catch (error) {
    console.error('Error loading profile:', error);
    // Fallback to localStorage
    const userData = JSON.parse(localStorage.getItem('user')) || {};
    
    document.getElementById('displayName').textContent = userData.name || '-';
    document.getElementById('displayPhone').textContent = userData.phone || '-';
    document.getElementById('displayLocation').textContent = userData.address || '-';
    document.getElementById('displayExperience').textContent = userData.experience ? `${userData.experience} years` : '-';
    document.getElementById('displayAbout').textContent = userData.about || '-';
    
    if (userData.profilePhoto) {
      currentPhoto = userData.profilePhoto;
      displayPhoto.innerHTML = `<img src="${userData.profilePhoto}" alt="Profile">`;
      displayPhoto.classList.remove('placeholder');
    }
  }
}

// Load stored farmer data when page loads
window.addEventListener('DOMContentLoaded', async () => {
  await updateDisplayCard(); // Fetch from DB first
  loadPhoto();
  
  const userData = JSON.parse(localStorage.getItem('user')) || {};
  
  // Pre-fill form with data from database
  if (userData.name) document.getElementById('farmerName').value = userData.name;

  if (userData.experience) document.getElementById('farmerExperience').value = userData.experience;

// Save details to database
document.getElementById('farmerForm').addEventListener('submit', async e => {
  e.preventDefault();
  const name = document.getElementById('farmerName').value.trim();
  const phone = document.getElementById('farmerPhone').value.trim();
  const location = document.getElementById('farmerLocation').value.trim();
  const experience = document.getElementById('farmerExperience').value.trim();
  const about = document.getElementById('farmerAbout').value.trim();

  if (!name || !phone || !location) {
    alert('Please fill all required fields.');
    return;
  }
  if (!/^[0-9]{10}$/.test(phone)) {
    alert('Enter a valid 10-digit phone number.');
    return;
  }

  try {
    // Verify token exists
    if (!token) {
      alert('Session expired. Please login again.');
      window.location.href = 'auth.html';
      return;
    }

    console.log('Saving profile data:', { name, phone, location, experience, about, hasPhoto: !!currentPhoto });

    // Save to database
    const response = await fetch(`${API_URL}/auth/profile`, {
      method: 'PUT',
      headers: {
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        name,
        phone,
        address: location,
        experience: experience || null,
        about: about || null,
        profilePhoto: currentPhoto || null
      })
    });

    if (!response.ok) {
      const errorData = await response.json().catch(() => ({ error: 'Unknown error' }));
      console.error('Server error:', errorData);
      throw new Error(errorData.error || 'Failed to save profile');
    }

    const updatedUser = await response.json();
    console.log('✅ Profile saved successfully:', updatedUser);
    
    // Update localStorage with fresh data from server
    localStorage.setItem('user', JSON.stringify(updatedUser));
    
    // Verify data was saved correctly
    if (updatedUser.experience !== experience || updatedUser.about !== about) {
      console.warn('Warning: Saved data does not match input');
    }
    
    // Update display and switch back
    await updateDisplayCard();
    document.getElementById('formCard').classList.add('hidden');
    document.getElementById('displayCard').classList.remove('hidden');
    
    document.getElementById('successMsg').textContent = "✅ Details saved successfully to database!";
    setTimeout(() => document.getElementById('successMsg').textContent = "", 3000);
  } catch (error) {
    console.error('Error saving profile:', error);
    alert('Failed to save profile to database. Please check your connection and try again.\n\nError: ' + error.message);
  }
});

// Load farmer's received orders
async function loadOrders() {
  const ordersContainer = document.getElementById('ordersContainer');
  const noOrders = document.getElementById('noOrders');
  
  try {
    console.log('Loading orders for farmer...');
    console.log('Token:', token);
    console.log('User:', user);
    
    if (!token || user.role !== 'farmer') {
      ordersContainer.innerHTML = '<div style="text-align: center; padding: 2rem; color: var(--danger);">Please login as a farmer to view orders.</div>';
      return;
    }
    
    const response = await fetch(`${API_URL}/farmer-orders`, {
      headers: {
        'Authorization': `Bearer ${token}`
      }
    });
    
    console.log('Response status:', response.status);
    
    if (!response.ok) {
      const errorData = await response.json().catch(() => ({}));
      console.error('Error response:', errorData);
      throw new Error(errorData.error || 'Failed to load orders');
    }
    
    const orders = await response.json();
    console.log('Orders received:', orders);
    
    if (orders.length === 0) {
      ordersContainer.innerHTML = '';
      noOrders.style.display = 'block';
      return;
    }
    
    noOrders.style.display = 'none';
    
    ordersContainer.innerHTML = orders.map(order => {
      console.log('Processing order:', order);
      console.log('Buyer phone:', order.buyerPhone);
      console.log('Buyer address:', order.buyerAddress);
      return `
      <div style="background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(20px); padding: 1.5rem; border-radius: 1rem; margin-bottom: 1rem; border: 2px solid rgba(255, 255, 255, 0.6); box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);">
        <div style="display: grid; grid-template-columns: 100px 1fr; gap: 1rem;">
          <img src="${order.product.image}" alt="${order.product.productName}" style="width: 100px; height: 100px; object-fit: cover; border-radius: 0.5rem; border: 2px solid rgba(255, 255, 255, 0.6);">
          <div>
            <h3 style="color: var(--primary); margin-bottom: 0.5rem; font-size: 1.2rem;">${order.product.productName}</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-bottom: 1rem;">
              <div>
                <div style="font-size: 0.85rem; color: #666; font-weight: 600;">👤 Buyer Name</div>
                <div style="font-weight: 600; color: #333;">${order.buyerName}</div>
              </div>
              <div>
                <div style="font-size: 0.85rem; color: #666; font-weight: 600;">📞 Phone Number</div>
                <div style="font-weight: 600; color: var(--secondary);">${order.buyerPhone || 'Not provided'}</div>
              </div>
              <div>
                <div style="font-size: 0.85rem; color: #666; font-weight: 600;">📦 Quantity</div>
                <div style="font-weight: 600; color: #333;">${order.quantity} kg</div>
              </div>
              <div>
                <div style="font-size: 0.85rem; color: #666; font-weight: 600;">💰 Total Price</div>
                <div style="font-weight: 600; color: var(--primary); font-size: 1.1rem;">₹${order.totalPrice}</div>
              </div>
              <div>
                <div style="font-size: 0.85rem; color: #666; font-weight: 600;">📍 Buyer Address</div>
                <div style="font-weight: 600; color: #333;">${order.buyerAddress || 'Not provided'}</div>
              </div>
              <div>
                <div style="font-size: 0.85rem; color: #666; font-weight: 600;">📅 Order Date</div>
                <div style="font-weight: 600; color: #333;">${new Date(order.createdAt).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' })}</div>
              </div>
            </div>
            <div style="padding: 0.5rem; background: rgba(40, 167, 69, 0.15); border-radius: 0.5rem; text-align: center;">
              <span style="color: var(--primary); font-weight: 700;">✅ ${order.status.toUpperCase()}</span>
            </div>
          </div>
        </div>
      </div>
    `;
    }).join('');
    
  } catch (error) {
    console.error('Error loading orders:', error);
    noOrders.style.display = 'none';
    ordersContainer.innerHTML = `<div style="text-align: center; padding: 2rem; color: var(--danger);">
      <p style="font-weight: 600; margin-bottom: 0.5rem;">Failed to load orders</p>
      <p style="font-size: 0.9rem;">${error.message}</p>
      <p style="font-size: 0.85rem; margin-top: 1rem; color: #666;">Make sure the backend server is running on http://localhost:3000</p>
    </div>`;
  }
}
</script>
