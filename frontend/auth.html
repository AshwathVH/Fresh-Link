<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Login / Register - Green Trade Network</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
:root{
  --primary:#28a745; --danger:#dc3545; --bg:#f0f2f5; --font:"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--font);
  background-image:linear-gradient(rgba(40, 167, 69, 0.2), rgba(220, 53, 69, 0.1)),url('https://images.unsplash.com/photo-1625246333195-78d9c38ad449?w=1920&q=80');
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
  background-repeat:no-repeat;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:2rem;
}
.container{
  background: rgba(255, 255, 255, 0.25);
  backdrop-filter: blur(30px) saturate(180%);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  padding: 2.5rem;
  width: 450px;
  max-width: 95vw;
  border-radius: 1.5rem;
  box-shadow: 
    0 8px 32px rgba(0,0,0,.3),
    inset 0 1px 0 rgba(255,255,255,0.6);
  border: 2px solid rgba(255, 255, 255, 0.5);
  animation: fadeIn 0.6s ease;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}
h1{
  color:var(--primary);
  text-align:center;
  margin-bottom:1.5rem;
  font-size:2rem;
  text-shadow: 0 2px 10px rgba(255, 255, 255, 0.8);
}
.tabs{
  display:flex;
  gap:.5rem;
  margin-bottom:2rem;
}
.tab{
  flex:1;
  padding:.7rem;
  background: rgba(255, 255, 255, 0.3);
  border: 1.5px solid rgba(255, 255, 255, 0.5);
  border-radius:.5rem;
  cursor:pointer;
  text-align:center;
  font-weight:600;
  transition: all 0.3s ease;
  color:#333;
}
.tab.active{
  background: rgba(40, 167, 69, 0.8);
  color:#fff;
  border-color: rgba(255, 255, 255, 0.6);
}
.tab:hover{
  transform: translateY(-2px);
}
.form{
  display:none;
}
.form.active{
  display:block;
}
.form-group{
  margin-bottom:1.2rem;
}
label{
  display:block;
  margin-bottom:.4rem;
  font-size:.9rem;
  color:#333;
  font-weight:600;
}
input, select{
  width:100%;
  padding:.7rem .9rem;
  background: rgba(255, 255, 255, 0.8);
  backdrop-filter: blur(15px);
  border: 1.5px solid rgba(255, 255, 255, 0.6);
  border-radius:.5rem;
  font-size:.95rem;
  transition: all 0.3s ease;
  color: #000 !important;
  font-weight: 500;
  -webkit-text-fill-color: #000 !important;
}
input:focus, select:focus{
  outline: none;
  background: rgba(255, 255, 255, 0.95);
  border: 1.5px solid rgba(40, 167, 69, 0.8);
  box-shadow: 0 0 20px rgba(40, 167, 69, 0.4);
  color: #000 !important;
  -webkit-text-fill-color: #000 !important;
}
input:-webkit-autofill,
input:-webkit-autofill:hover,
input:-webkit-autofill:focus,
input:-webkit-autofill:active {
  -webkit-box-shadow: 0 0 0 30px rgba(255, 255, 255, 0.9) inset !important;
  -webkit-text-fill-color: #000 !important;
  color: #000 !important;
}
input::placeholder{
  color: rgba(0, 0, 0, 0.4);
  font-weight: 400;
}
select{
  color: #000;
}
.error{
  color:var(--danger);
  font-size:.85rem;
  margin-top:.3rem;
  font-weight:600;
  text-shadow: 0 1px 2px rgba(255,255,255,0.8);
}
.success{
  color:var(--primary);
  font-size:.85rem;
  margin-top:.3rem;
  font-weight:600;
  text-shadow: 0 1px 2px rgba(255,255,255,0.8);
}
button{
  width:100%;
  padding:.9rem;
  margin-top:1rem;
  background: rgba(40, 167, 69, 0.8);
  color:#fff;
  border: 2px solid rgba(255, 255, 255, 0.4);
  border-radius:.5rem;
  cursor:pointer;
  font-size:1.1rem;
  font-weight:600;
  transition: all 0.3s ease;
  backdrop-filter: blur(15px);
}
button:hover{
  background: rgba(33, 136, 56, 0.9);
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(40, 167, 69, 0.5);
}
button:disabled{
  opacity:0.6;
  cursor:not-allowed;
}
.link{
  text-align:center;
  margin-top:1rem;
  font-size:.9rem;
  color:#555;
}
.link a{
  color:var(--primary);
  text-decoration:none;
  font-weight:600;
}
.link a:hover{
  text-decoration:underline;
}
.language-selector{
  position: absolute;
  top: 1rem;
  right: 1rem;
  background: rgba(255, 255, 255, 0.9);
  border: 1.5px solid rgba(255, 255, 255, 0.6);
  border-radius: 0.5rem;
  padding: 0.3rem 0.6rem;
  font-size: 0.8rem;
  cursor: pointer;
  transition: all 0.3s ease;
  width: auto;
}
.language-selector:hover{
  background: rgba(255, 255, 255, 1);
  transform: translateY(-2px);
}
</style>
</head>
<body>

<select id="languageSelector" class="language-selector" onchange="i18n.setLanguage(this.value)">
  <option value="en">🇬🇧 English</option>
  <option value="hi">🇮🇳 हिंदी</option>
  <option value="kn">🇮🇳 ಕನ್ನಡ</option>
  <option value="ml">🇮🇳 മലയാളം</option>
</select>

<div class="container">
  <div style="text-align: center; margin-bottom: 1rem;">
    <img src="GTN_logo.png" alt="GTN Logo" style="width: 100px; height: 100px; object-fit: contain;">
  </div>
  <h1 data-i18n="auth.title">Green Trade Network</h1>
  
  <div class="tabs">
    <div class="tab active" onclick="switchTab('login')" data-i18n="auth.loginTab">Login</div>
    <div class="tab" onclick="switchTab('register')" data-i18n="auth.registerTab">Register</div>
  </div>

  <!-- Login Form -->
  <form id="loginForm" class="form active">
    <div class="form-group">
      <label for="loginEmail" data-i18n="auth.email">Email</label>
      <input type="email" id="loginEmail" required data-i18n-placeholder="auth.email">
    </div>
    
    <div class="form-group">
      <label for="loginPassword" data-i18n="auth.password">Password</label>
      <input type="password" id="loginPassword" required data-i18n-placeholder="auth.password">
    </div>
    
    <div class="form-group">
      <label for="loginRole" data-i18n="auth.loginAs">Login as</label>
      <select id="loginRole" required>
        <option value="farmer" data-i18n="auth.farmer">Farmer</option>
        <option value="buyer" data-i18n="auth.buyer">Buyer</option>
      </select>
    </div>
    
    <div class="error" id="loginError"></div>
    <div class="success" id="loginSuccess"></div>
    
    <button type="submit" id="loginBtn" data-i18n="auth.loginButton">Login</button>
    
    <div class="link">
      <a href="landing.html" data-i18n="auth.backToHome">← Back to Home</a>
    </div>
  </form>

  <!-- Register Form -->
  <form id="registerForm" class="form">
    <div class="form-group">
      <label for="regName" data-i18n="auth.name">Full Name</label>
      <input type="text" id="regName" required data-i18n-placeholder="auth.name">
    </div>
    
    <div class="form-group">
      <label for="regEmail" data-i18n="auth.email">Email</label>
      <input type="email" id="regEmail" required data-i18n-placeholder="auth.email">
    </div>
    
    <div class="form-group">
      <label for="regPassword" data-i18n="auth.password">Password</label>
      <input type="password" id="regPassword" required data-i18n-placeholder="auth.password">
    </div>
    
    <div class="form-group">
      <label for="regPhone">Phone Number</label>
      <input type="tel" id="regPhone" placeholder="+91 1234567890">
    </div>
    
    <div class="form-group">
      <label for="regRole">I am a</label>
      <select id="regRole" required>
        <option value="farmer">Farmer (Sell Products)</option>
        <option value="buyer">Buyer (Buy Products)</option>
      </select>
    </div>
    
    <div class="form-group">
      <label for="regAddress">Address</label>
      <input type="text" id="regAddress" placeholder="City, State">
    </div>
    
    <div class="error" id="regError"></div>
    <div class="success" id="regSuccess"></div>
    
    <button type="submit" id="regBtn">Register</button>
    
    <div class="link">
      <a href="landing.html">← Back to Home</a>
    </div>
  </form>
</div>

<script>
const API_URL = 'http://localhost:3000/api';

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
  
  if (tab === 'login') {
    document.querySelectorAll('.tab')[0].classList.add('active');
    document.getElementById('loginForm').classList.add('active');
  } else {
    document.querySelectorAll('.tab')[1].classList.add('active');
    document.getElementById('registerForm').classList.add('active');
  }
  
  // Clear errors
  document.querySelectorAll('.error, .success').forEach(e => e.textContent = '');
}

// Login
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  
  const loginError = document.getElementById('loginError');
  const loginSuccess = document.getElementById('loginSuccess');
  const loginBtn = document.getElementById('loginBtn');
  
  loginError.textContent = '';
  loginSuccess.textContent = '';
  
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const selectedRole = document.getElementById('loginRole').value;
  
  if (!email || !password) {
    loginError.textContent = 'Please fill in all fields';
    return;
  }
  
  loginBtn.disabled = true;
  loginBtn.textContent = 'Logging in...';
  
  try {
    const response = await fetch(`${API_URL}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    
    const data = await response.json();
    
    if (!response.ok) {
      throw new Error(data.error || 'Login failed');
    }
    
    // Verify the user's role matches the selected role
    if (data.user.role !== selectedRole) {
      throw new Error(`This account is registered as a ${data.user.role}, not a ${selectedRole}. Please select the correct role.`);
    }
    
    // Save token and user info
    localStorage.setItem('token', data.token);
    localStorage.setItem('user', JSON.stringify(data.user));
    
    loginSuccess.textContent = 'Login successful! Redirecting...';
    
    // Redirect based on role
    setTimeout(() => {
      if (data.user.role === 'farmer') {
        window.location.href = 'farmer_page.html';
      } else {
        window.location.href = 'buyer_page.html';
      }
    }, 1000);
    
  } catch (error) {
    loginError.textContent = error.message;
    loginBtn.disabled = false;
    loginBtn.textContent = 'Login';
  }
});

// Register
document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  
  const regError = document.getElementById('regError');
  const regSuccess = document.getElementById('regSuccess');
  const regBtn = document.getElementById('regBtn');
  
  regError.textContent = '';
  regSuccess.textContent = '';
  
  const name = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const password = document.getElementById('regPassword').value;
  const phone = document.getElementById('regPhone').value.trim();
  const role = document.getElementById('regRole').value;
  const address = document.getElementById('regAddress').value.trim();
  
  if (!name || !email || !password) {
    regError.textContent = 'Please fill in required fields';
    return;
  }
  
  if (password.length < 6) {
    regError.textContent = 'Password must be at least 6 characters';
    return;
  }
  
  regBtn.disabled = true;
  regBtn.textContent = 'Creating account...';
  
  try {
    console.log('Attempting registration with:', { name, email, phone, role, address });
    const response = await fetch(`${API_URL}/auth/register`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, password, phone, role, address })
    });
    
    console.log('Response status:', response.status);
    const data = await response.json();
    console.log('Response data:', data);
    
    if (!response.ok) {
      throw new Error(data.error || 'Registration failed');
    }
    
    // Save token and user info
    localStorage.setItem('token', data.token);
    localStorage.setItem('user', JSON.stringify(data.user));
    
    regSuccess.textContent = 'Account created! Redirecting...';
    
    // Redirect based on role
    setTimeout(() => {
      if (data.user.role === 'farmer') {
        window.location.href = 'farmer_page.html';
      } else {
        window.location.href = 'buyer_page.html';
      }
    }, 1000);
    
  } catch (error) {
    console.error('Registration error:', error);
    regError.textContent = error.message || 'Failed to connect to server. Check console for details.';
    regBtn.disabled = false;
    regBtn.textContent = 'Register';
  }
});
</script>
<script src="i18n.js"></script>
</body>
</html>
